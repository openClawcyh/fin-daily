<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日财经日报 · 历史门户</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2024;--muted:#6b7280;--line:#e6e8ec;
--red:#d93025;--redbg:#fdecea;--green:#188038;--greenbg:#e6f4ea;--gray:#5f6368;--graybg:#f1f3f4;--accent:#1a73e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
a{color:var(--accent);text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:22px 0 8px;font-weight:700}
h2 .num{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;background:var(--accent);color:#fff;border-radius:6px;font-size:12px;margin-right:8px}
.meta{color:var(--muted);font-size:13px;margin:6px 0 0}
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:600}
.pct.up{color:var(--green)} .pct.down{color:var(--red)}
.chip{display:inline-block;background:var(--graybg);color:var(--ink);border-radius:20px;padding:2px 10px;font-size:12px;margin:3px 4px 3px 0}
.chip.up{background:var(--greenbg);color:var(--green)}
.chip.down{background:var(--redbg);color:var(--red)}
.banner{background:linear-gradient(135deg,#1a73e8,#0b57d0);color:#fff;border-radius:12px;padding:16px 18px;font-size:15px;margin:14px 0}
.banner b{font-size:16px}
.sec{border-radius:10px;padding:12px 14px;margin:10px 0}
.sec .h{font-weight:700;margin:0 0 6px;font-size:14px}
.sec.red{background:var(--redbg);border-left:4px solid var(--red)}
.sec.green{background:var(--greenbg);border-left:4px solid var(--green)}
.sec.gray{background:var(--graybg);border-left:4px solid var(--gray)}
.sec ul{margin:6px 0 0;padding-left:18px}
.sec li{margin:5px 0}
.ev{margin:8px 0;padding:8px 10px;background:#fafafa;border-radius:8px;border:1px solid var(--line)}
.ev b{color:var(--ink)}
.ev .st{display:inline-block;background:#e8eefc;color:#2242a8;margin-left:6px;border-radius:6px;padding:1px 8px;font-size:12px}
.nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.nav a{font-size:13px}
.hist-item{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;color:var(--ink)}
.hist-item:hover{border-color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.hist-date{font-weight:700}
.hist-line{color:var(--muted);font-size:13px;margin-top:5px}
.small{color:var(--muted);font-size:12px;margin-top:18px}
@media print{body{background:#fff}.card,.sec{break-inside:avoid}}
</style>
</head>
<body><div class="wrap">

<div class="card">
  <h1>📊 每日财经日报 · A股板块映射</h1>
  <div class="meta">历史日报门户 · 共 1 篇 · 点日期看当日完整页</div>
</div>

<a class="hist-item" href="reports/2026-11-06.html">
  <div class="hist-date">📅 2026-11-06 ｜ 结构性高开（指数偏强、内部剧烈分化）</div>

</a>

<div class="small">本报告为信息整理，不构成投资建议。</div>

</div></body>
</html>
